<div class="menu" [class.menu--vertical]="vertical">
  @for (item of menuItems; track item.id) {
    <a
      [routerLink]="item.route"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="menu-link-active"
      class="menu-link"
      (click)="linkClicked.emit()">
      {{ item.name }}
    </a>
  }
</div>
