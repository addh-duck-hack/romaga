<div class="nav">
  <div class="nav-inner">
    <a class="brand" routerLink="/" (click)="closeMobile()">
      <img [src]="logoSrc" alt="Transportes ROMAGA" class="brand-logo" width="63" height="40" />
      <span class="brand-text">
        <b>Transportes Romaga</b>
        <span>Fletes y Servicios S.A. de C.V.</span>
      </span>
    </a>

    <main-menu class="nav-links-desktop" (linkClicked)="closeMobile()" />

    <div class="nav-side">
      <a class="nav-phone" href="tel:+527821452309">Oficina 782 145 2309</a>
      <social-icons class="nav-social-desktop" />
      <a class="btn btn-primary nav-cta-desktop" routerLink="/contacto" (click)="closeMobile()">Solicitar cotización</a>
      <button
        type="button"
        class="nav-toggle"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobileMenu"
        aria-label="Abrir menú"
        (click)="toggleMobile()">
        <span></span>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div class="nav-mobile" id="mobileMenu">
      <main-menu [vertical]="true" (linkClicked)="closeMobile()" />
      <a class="nav-phone nav-phone--mobile" href="tel:+527821452309">Oficina 782 145 2309</a>
      <social-icons />
      <a class="btn btn-primary nav-cta-mobile" routerLink="/contacto" (click)="closeMobile()">Solicitar cotización</a>
    </div>
  }
</div>
