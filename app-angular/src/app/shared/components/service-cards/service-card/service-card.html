<a class="svc-card" [routerLink]="card().route">
  <div class="svc-photo">
    <img [src]="card().image" [alt]="card().title" loading="lazy" />
  </div>
  <div class="svc-body">
    <h3>{{ card().title }}</h3>
    <p>{{ card().description }}</p>
    <span class="more">Ver detalle →</span>
  </div>
</a>
